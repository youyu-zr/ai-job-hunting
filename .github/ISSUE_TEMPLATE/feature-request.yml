name: Feature request
description: 提出功能或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么重复劳动或障碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 隐私与平台边界
      description: 是否涉及简历、Cookie、自动发送、账号权限或平台规则？
