name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:prelaunch
      - run: pnpm build
      - name: Inspect userscript artifacts
        run: |
          sha256sum ../ai-job-hunting.user.js dist/ai-job-hunting.user.js
          wc -c ../ai-job-hunting.user.js dist/ai-job-hunting.user.js
      - run: pnpm verify:public
      - name: Preserve userscript artifacts when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: userscript-verification-${{ github.run_id }}
          path: |
            ai-job-hunting.user.js
            frontend/dist/ai-job-hunting.user.js
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn test "-Dtest=!EmailTest,!JobAgentTest"
      - run: mvn -DskipTests package
