# Local development template. Copy to application.properties; never commit credentials.
server.address=127.0.0.1
server.port=9100
spring.application.name=ai-job
spring.main.allow-circular-references=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.ai.retry.max-attempts=1
# Required by the legacy Spring AI auto-configuration; model calls use the pool below.
spring.ai.openai.api-key=unused-local-placeholder

spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.datasource.url=${AI_JOB_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false}
spring.datasource.username=${AI_JOB_DB_USERNAME}
spring.datasource.password=${AI_JOB_DB_PASSWORD}

smart.username=${SMART_CONFIG_USERNAME:admin}
smart.password=${SMART_CONFIG_PASSWORD}
admin.userId.list=[]
boss.identity.verify.enabled=true

beta.auto-grant.until=${BETA_AUTO_GRANT_UNTIL:2026-12-30T23:59:59.999+08:00}
payment.enabled=false
ai.custom-api.allow-private-addresses=${AI_CUSTOM_API_ALLOW_PRIVATE_ADDRESSES:false}
ai.custom-api.allow-insecure-http=${AI_CUSTOM_API_ALLOW_INSECURE_HTTP:false}
ai.request.max-concurrent=${AI_MAX_CONCURRENT_MODEL_REQUESTS:32}

siliconflow.api-key=${SILICONFLOW_API_KEY:}
siliconflow.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
siliconflow.chat-model=${SILICONFLOW_CHAT_MODEL:deepseek-ai/DeepSeek-V3.2}
siliconflow.resume-text-model=${SILICONFLOW_RESUME_TEXT_MODEL:deepseek-ai/DeepSeek-V3.2}
siliconflow.resume-vision-model=${SILICONFLOW_RESUME_VISION_MODEL:Qwen/Qwen3-VL-32B-Thinking}
siliconflow.resume-timeout-seconds=${SILICONFLOW_RESUME_TIMEOUT_SECONDS:90}
openai.pool.config.list=[{"base-url":"${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}","api-key":"${SILICONFLOW_API_KEY:}","name":"siliconflow-chat","completions-path":"/chat/completions","chat.options.model":"${SILICONFLOW_CHAT_MODEL:deepseek-ai/DeepSeek-V3.2}","chat.options.first":true}]

login-Filter.freeLoginArray=["/api/user/import/resume","/api/user/silently/login"]
logging.file.name=logs/ai-job.log
server.tomcat.accesslog.enabled=false
